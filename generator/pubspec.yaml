name: getx_binding_annotation_generator
description: A Code Generator Plugin to Generate Pages and Dependencies for GetX State Manager base on Annotation. (Generator)
version: 0.3.1
homepage: https://resam.site
repository: https://github.com/reesaam/flutter_getx_dependencies_binding_annotation.git
funding:
  - https://resam.site

environment:
  sdk: ">=3.11.0 <4.0.0"

features:
  dot-shorthands: true

dependencies:
  build_runner: ^2.15.1
#  analyzer: ^8.1.1
  build: ^4.0.7
  source_gen: ^4.2.3
  dart_style: ^3.1.3
#  getx_binding_annotation: ^0.3.2
  getx_binding_annotation:
    path: ../annotation/

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0
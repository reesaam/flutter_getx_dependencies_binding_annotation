name: example_for_getx_binding_annotation
description: A project used to demo the GetxDependenciesBindingAnnotation
version: 0.3.4
homepage: https://www.linkedin.com/in/resam/
repository: https://github.com/reesaam/flutter_getx_dependencies_binding_annotation

environment:
  sdk: ">=3.11.0 <4.0.0"

features:
  dot-shorthands: true

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
#  analyzer: ^8.1.1
  getx_binding_annotation:
    path: ../../annotation/

dev_dependencies:
  build_runner: ^2.15.1
#  dartdoc: ^9.0.8
  lints: ^6.1.0
  test: ^1.24.0
  getx_binding_annotation_generator:
    path: ../../generator/

dependency_overrides:
  meta: 1.17.0